<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ws-tile" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset=".55" stop-color="#0c1322"/>
      <stop offset="1" stop-color="#0a101d"/>
    </linearGradient>
    <linearGradient id="ws-needle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ws-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Dark app tile -->
  <rect width="64" height="64" rx="15" fill="url(#ws-tile)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="url(#ws-ring)" stroke-opacity=".55" stroke-width="1.5"/>

  <!-- Globe grid -->
  <g fill="none" stroke="#93c5fd" stroke-opacity=".3" stroke-width="1.4">
    <circle cx="32" cy="32" r="17.5"/>
    <ellipse cx="32" cy="32" rx="17.5" ry="7.2"/>
    <ellipse cx="32" cy="32" rx="7.2" ry="17.5"/>
    <line x1="14.5" y1="32" x2="49.5" y2="32"/>
  </g>
  <!-- Soft globe highlight -->
  <circle cx="26" cy="25" r="12" fill="#3b82f6" fill-opacity=".08"/>

  <!-- Compass needle -->
  <path d="M32 11.5 L37.8 26.5 L32 22.4 L26.2 26.5 Z" fill="url(#ws-needle)"/>
  <path d="M32 52.5 L26.2 37.5 L32 41.6 L37.8 37.5 Z" fill="#e2e8f0" fill-opacity=".9"/>
  <circle cx="32" cy="32" r="3.2" fill="#0a101d" stroke="url(#ws-needle)" stroke-width="1.7"/>

  <!-- Orbit dot -->
  <circle cx="49.5" cy="18" r="2" fill="#60a5fa"/>
</svg>

